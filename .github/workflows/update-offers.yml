name: Natur - Angebote taeglich aktualisieren
on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: natur-offers
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python-Adapter testen
        run: python -m unittest discover -s scripts/tests -v
      - name: Angebotsquellen pruefen
        run: python scripts/update_offers.py
      - name: Status und neue Angebote speichern
        if: always()
        run: |
          if ! git diff --quiet -- docs/offers.json docs/source-status.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/offers.json docs/source-status.json
            git commit -m "Update offer and source status"
            git pull --rebase
            git push
          else
            echo "Keine geaenderten Daten"
          fi

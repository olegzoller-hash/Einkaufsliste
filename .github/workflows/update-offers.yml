name: Angebotsdaten aktualisieren
on:
  schedule:
    - cron: '0 8 * * 0'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: natur-offers
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testen
        run: python -m unittest discover -s scripts/tests -v
      - name: Quellen auswerten
        run: python scripts/update_offers.py
      - name: Änderungen speichern
        run: |
          if ! git diff --quiet -- docs/offers.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/offers.json
            git commit -m "Aktualisiere Angebotsdaten"
            git push
          else
            echo "Keine Änderungen"
          fi

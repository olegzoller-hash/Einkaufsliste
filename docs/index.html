<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#285544"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="./manifest.webmanifest?v=3"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=3"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300&display=swap" rel="stylesheet"><link rel="stylesheet" href="./style.css?v=3"><title>Natur · Einkaufsliste</title></head><body>
<main class="wrap"><header class="hero"><h1>Einkaufsliste</h1><button id="share" class="share" hidden>Teilen</button></header>
<section id="setup" class="setup"><h2>Gemeinsam einkaufen</h2><p>Eine Liste einmal erstellen und den Link teilen. Keine Registrierung.</p><button id="create" class="primary">Gemeinsame Liste erstellen</button><p class="muted">Du hast bereits eine Liste? Dann den geteilten Link hier einfügen, statt eine neue Liste zu erstellen.</p><form id="joinForm" class="entry"><input id="joinLink" aria-label="Einladungslink" placeholder="Einladungslink einfügen" autocomplete="off" required><button type="submit" class="plus" aria-label="Liste öffnen">→</button></form><p id="setupHint" class="muted"></p></section>
<section id="workspace" hidden><form id="addForm" class="entry"><input id="product" maxlength="140" placeholder="Produkt, optional (Markt)" aria-label="Produkt, optional Markt" autocomplete="off" required><button type="submit" class="plus" aria-label="Produkt hinzufügen">+</button></form><button id="refresh" class="offers">Angebote abgleichen</button><p id="status" class="muted" aria-live="polite"></p><div id="groups"></div></section></main>
<div id="toast" class="toast" hidden><span id="toastText"></span><button id="undo">Rückgängig</button></div><dialog id="marketDialog"><form method="dialog"><h2>Markt auswählen</h2><div id="marketButtons"></div><button value="cancel">Abbrechen</button></form></dialog>
<script src="./config.js"></script><script type="module" src="./app.js"></script></body></html>
